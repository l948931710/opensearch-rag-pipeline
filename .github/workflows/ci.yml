name: CI

# Roadmap-to-8 EVAL-3: the previously-absent CI gate. Runs the full test suite in SIMULATE mode on
# every push to main and every PR — catching extractor/chunker/retriever/serving regressions before
# they merge (the dim9 "no CI / advisory gates" gap). No cloud creds: RAG_SIMULATE forces hash
# embeddings + mock HA3, and DB-integration tests self-skip without a local MySQL (skipif_no_db).
# Live layers (run_eval l3/l4/l5 + l1/l2 against real HA3) stay manual/staged — they need creds,
# the gold set, and the out-of-repo data repo, so they are deliberately NOT in this blocking gate.

on:
  push:
    # 批次8（ultra ci.yml:12）：阻断门必须跑在**实际出包的分支**上——生产工作直推
    # claude/ontology-p0（SAE/DataWorks 包从它切）且无 PR，此前 main-only 触发让
    # 测试/lint/gitleaks/CVE 审计对 shipped 代码全豁免。claude/** 覆盖全部工作分支。
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

# 同 ref 的新 push 取消在跑的旧 run（solo 直推 main 的节奏下，旧 commit 的结论没有价值；
# 一小时三连推曾三条 pipeline 全量跑完）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 3.10=本地 stack-test conda；3.11=生产 serving（Dockerfile python:3.11-slim）。
      # 套件 ~17s，双版本成本可忽略；版本差异行为（enum/asyncio 语义）不再漏过。
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      RAG_SIMULATE: "true"
      RAG_SIMULATE_API: "true"
      RAG_SIMULATE_DB: "true"
      RAG_SIMULATE_OSS: "true"
      RAG_SIMULATE_OPENSEARCH: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # perf#21：缓存 pip 下载目录（PyMuPDF/opensearch-py/oss2/dashscope/ha3-sdk 等重依赖树），
          # 与 frontend job 的 npm 缓存对称；键随 pyproject.toml 变化自动失效。
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,production,ocr,api]"
      - name: Lint (ruff — BLOCKING; 核心 2026-07-04 清零、全仓 2026-07-18 纳管清零(B6 P2-16)，新增即红)
        run: python -m ruff check .
      - name: General-ability eval gate (sim — 门2防劫持+门3分级路由，离线零网络)
        # RB-05：金集在仓（goldset/general_ability_set.json）、默认 RAG_SIMULATE=true、
        # 零 API 费用——sim 可跑的效果门没有理由留在部署前手工跑。live 档（--live）仍手工。
        run: python -m eval_harness.general_ability_eval
      - name: Test (simulate mode — no external services)
        # perf F#48：xdist 并行（ubuntu runner 4 vCPU）；--dist loadgroup + conftest 分组钩子
        # 复刻 loadfile 语义并把共享本地栈的模块钉到同一 worker（CI 无本地 DB，该组多为 skip）。
        # 覆盖率只在 3.11 腿收集（与生产 serving 版本一致；避免 matrix 双跑重复产物）。
        # B6（P2-12）：可见期已过（基线 79%）——立 fail-under=75 全局保底（关键模块
        # 风险加权门=后续二期；阈值只防「大幅裸奔下坠」，不追基线数字）。
        run: >-
          python -m pytest tests/ -q -p no:cacheprovider -n auto --dist loadgroup
          --junitxml=pytest-junit.xml
          ${{ matrix.python-version == '3.11' && '--cov=opensearch_pipeline --cov-report=xml --cov-report=term --cov-fail-under=75' || '' }}
      - name: Upload junit (failure only — 排障用，红了才值得留)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: pytest-junit.xml
      - name: Upload coverage report (3.11)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-xml
          path: coverage.xml

  # DB 集成门：test job 是纯 simulate（无 MySQL），DB 集成模块（test_pipeline/
  # test_classification/test_concurrency/test_image_funnel 的 requires_local_db 族）在
  # 那里整体 self-skip —— routes/、qa_facts、feedback_handler 里成百条 SQL 从未在合并前
  # 过语法/建表/collation 检查（contribution.py 的跨库 collation JOIN 1267 就是漏到
  # staging 活测才炸的）。本 job 起 MySQL 8.0 service（对齐 RDS/docker-compose 版本），
  # 用 scripts/ci_load_schema.sh 按 schema/README.md 矩阵从零建双库（这一步本身就是
  # "权威 DDL 可从零建库"的门），再只跑 DB 标记的 4 个模块。与 test job 并行，不拖慢它。
  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: your_password   # 对齐 docker-compose.yml / tests/local_stack.py 的 dev 凭证
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 与 test job / 本地 make test 同款全局 simulate（LLM/OSS/HA3 均 mock）；
      # requires_local_db 族在 simulate 下本就对本地栈做真实 DML（见 tests/local_stack.py 文档）。
      RAG_SIMULATE: "true"
      RAG_SIMULATE_API: "true"
      RAG_SIMULATE_DB: "true"
      RAG_SIMULATE_OSS: "true"
      RAG_SIMULATE_OPENSEARCH: "true"
      # 指向 service container —— conftest 的 prod-guard 只放行本机目标，127.0.0.1 合规；
      # local_stack 探测用 config 内凭证首连即中，无需回退。
      RAG_RDS_HOST: 127.0.0.1
      RAG_RDS_PORT: "3306"
      RAG_RDS_USER: root
      RAG_RDS_PASSWORD: your_password
      RAG_RDS_DATABASE: fuling_knowledge
      RAG_RDS_OPERATION_DATABASE: fuling_operation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,production,ocr,api]"
      - name: Load authoritative schema (both DBs, numeric order)
        run: bash scripts/ci_load_schema.sh
      # 防"绿得发虚"：requires_local_db 族在探测失败时整体 skip（test job 里正是如此），
      # 若本 job 探测哪天悄悄断线（如驱动/认证依赖变化），pytest 仍会全 skip 变绿。
      # 这里显式要求探测必须接线成功，否则直接红。
      - name: Preflight — DB probe must wire (no silent all-skip)
        run: |
          python -c "
          from tests.local_stack import ensure_local_db_wired, local_db_unavailable_reason
          assert ensure_local_db_wired(), local_db_unavailable_reason()
          print('DB probe wired OK')
          "
      - name: DB integration tests (real MySQL, real DML)
        # 这些模块在 conftest 的 xdist 分组里本就同组串行（互相清表），xdist 无收益 → 直接串行跑
        run: >-
          python -m pytest tests/test_pipeline.py tests/test_classification.py
          tests/test_concurrency.py tests/test_image_funnel.py
          tests/test_kb_db_integration.py
          -q --tb=short -p no:cacheprovider

  # 供应链/密钥门（P2-03）：secret 扫描 + 依赖 CVE 审计。此前 CI 完全无安全门。
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # 全历史：gitleaks 既扫工作树也扫历史提交
      # 【阻塞】secret 扫描：默认规则 + .gitleaks.toml 白名单（测试合成假 key + 生产指纹非密钥）。
      # 价值主要在【防未来误提交】真凭证——当前 .mcp.json/.env.* 均 gitignored，工作树本就干净。
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # 批次8 热修②：security 作业须与 requirements-prod.lock 的编译目标一致（uv compile
          # --python-version 3.11，生产 serving 同版）——3.10 下 lock 内 ≥3.11-only 轮子
          # （rpds-py 2026.6.3 等）解析失败，pip-audit 装依赖阶段就死（非 CVE 发现）。
          # 发布分支首跑暴露：lock 升版后 main 无 push，security 从未用新 lock 跑过。
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # 依赖 CVE 审计【阻塞】：2026-07-04 基线 triage=0 已知 CVE（run 28692900106，77 包全新
      # 解析到最新版）。CI 每次 fresh resolve，新上游 CVE 会即时红——这正是本门的目的。
      # 若某个传递依赖的 CVE 不可修且不影响本仓库用法：加 `--ignore-vuln <ID>`（附一行理由），
      # 勿回退 continue-on-error（会重新静默积债）。
      - name: Dependency CVE audit (pip-audit — BLOCKING; baseline clean 2026-07-04)
        run: |
          # setuptools 显式升级：PYSEC-2026-3447（79.x sdist MANIFEST 排除可被 NFD 文件名
          # 绕过，修复版 83.0.0）——runner 预装 79.0.1 会被 fresh-resolve 审计抓红；
          # 本项目 lock 未钉 setuptools，升级仅影响审计环境本身
          python -m pip install --upgrade pip pip-audit "setuptools>=83"
          pip install -e ".[production,api,ocr]"
          python -m pip_audit --desc
      # 供应链补链（2026-07-11 重审计 §6；main 摘取适配 2026-07-18；lock 审计 2026-07-21 迁移批B3）：
      # 钉版审计 + SBOM + trivy。两条真实安装源都审：
      # ① requirements.txt = SAE zip/buildpack 真实安装源（批次8 起顶层 == 钉版；a64aa86 起
      #    刻意保留浮动/顶层钉版，不切 lock 以免 buildImage exit 1）——直接对它跑 pip-audit，
      #    审计的即 SAE 现网暴露面。上面 fresh-resolve 步审计的是 extras 最新可解析集，互补。【阻塞】。
      - name: Pinned requirements CVE audit (pip-audit on requirements.txt — BLOCKING)
        run: python -m pip_audit -r requirements.txt --desc
      # ①b requirements-prod.lock = Docker 镜像真实安装源（迁移批B3：uv 生成 + --require-hashes）。
      #    与 ①互补——镜像路径按 hash 锁全量闭包，此步审的是该闭包的 CVE 暴露面。锁更新须重跑
      #    lock 头部的 uv 命令并复审。【阻塞】。
      - name: Hashed lock CVE audit (pip-audit on requirements-prod.lock — BLOCKING)
        run: python -m pip_audit -r requirements-prod.lock --desc
      # ①c requirements-dataworks-py37.txt = DataWorks py3.7 节点钉版集镜像（Majors δ3/M13）。
      #    节点每次运行 pip install 现场解析传递闭包 → 本步带解析审计=pod 真实暴露面。
      #    基线（59 条，py3.7 兼容上限不可升版，逐条评估见 deploy/dataworks_py37_audit_baseline.txt）
      #    拼 --ignore-vuln 放行；**新 ID 仍红**（先逐条评估补基线才准过——勿 continue-on-error）。
      - name: DataWorks py3.7 pins CVE audit (pip-audit — BLOCKING beyond baseline)
        run: |
          IGNORES=$(grep -vE '^\s*(#|$)' deploy/dataworks_py37_audit_baseline.txt \
                    | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          python -m pip_audit -r requirements-dataworks-py37.txt --desc $IGNORES
      # ② SBOM（SPDX，syft）：覆盖 Python lock + console-app/package-lock.json，
      #    产物上传 artifact（供应链事件时按 SBOM 反查暴露面，此前全仓无 SBOM）。
      - name: Generate SBOM (syft — SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx.json
      # ③ trivy fs 扫描【阻塞，HIGH/CRITICAL 且有修复版才红】：npm lock + Python lock +
      #    Dockerfile 配置面（digest 固定/USER 非 root 等）。与 pip-audit 互补：trivy 管
      #    npm 侧与镜像配置，pip-audit 管 Python 侧语义更细。
      # ⚠️ step name 含「冒号+空格」必须整体加引号——未引号的 `fs:` 会把 name 解析成
      # 嵌套映射 → 整个 workflow 无效 → 每次 push 0 秒 startup failure（2026-07-12..15 实翻）
      - name: "Trivy scan (fs: lockfiles + Dockerfile config — BLOCKING on fixable HIGH/CRITICAL)"
        # 批次8 热修：上游把裸号 tag（0.28.0）全删改 v 前缀 → 旧引用解析失败、security
        # 作业 setup 即红（发布分支首跑 CI 当场暴露）。按 SHA 钉死（=v0.36.0 的 commit，
        # 与 Dockerfile digest-pinning 同一供应链纪律，tag 再被动也不受影响）。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 成绩单新鲜度门（RB-05）：冻结基线的金集 SHA / 模型 / prompt 指纹与当前代码比对——
  # 「基线过期」从此是 CI 红灯，不再靠部署前手工 release-gate 才 FATAL、或压根无人发现。
  # 两阶段上线：refreeze（RAG live + agent live，user-gated）落地前 continue-on-error
  # 先亮红叉不阻塞；refreeze 后删掉 continue-on-error 翻硬门（RB-05 E2）。
  baseline-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # E2 翻硬门时删除本行
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[production,api]"
      - name: Check baseline freshness (RB-05)
        run: python scripts/check_baseline_freshness.py
