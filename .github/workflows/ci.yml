name: CI

# Roadmap-to-8 EVAL-3: the previously-absent CI gate. Runs the full test suite in SIMULATE mode on
# every push to main and every PR — catching extractor/chunker/retriever/serving regressions before
# they merge (the dim9 "no CI / advisory gates" gap). No cloud creds: RAG_SIMULATE forces hash
# embeddings + mock HA3, and DB-integration tests self-skip without a local MySQL (skipif_no_db).
# Live layers (run_eval l3/l4/l5 + l1/l2 against real HA3) stay manual/staged — they need creds,
# the gold set, and the out-of-repo data repo, so they are deliberately NOT in this blocking gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同 ref 的新 push 取消在跑的旧 run（solo 直推 main 的节奏下，旧 commit 的结论没有价值；
# 一小时三连推曾三条 pipeline 全量跑完）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 3.10=本地 stack-test conda；3.11=生产 serving（Dockerfile python:3.11-slim）。
      # 套件 ~17s，双版本成本可忽略；版本差异行为（enum/asyncio 语义）不再漏过。
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      RAG_SIMULATE: "true"
      RAG_SIMULATE_API: "true"
      RAG_SIMULATE_DB: "true"
      RAG_SIMULATE_OSS: "true"
      RAG_SIMULATE_OPENSEARCH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # perf#21：缓存 pip 下载目录（PyMuPDF/opensearch-py/oss2/dashscope/ha3-sdk 等重依赖树），
          # 与 frontend job 的 npm 缓存对称；键随 pyproject.toml 变化自动失效。
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,production,ocr,api]"
      - name: Lint (ruff — BLOCKING; 存量债 2026-07-04 清零，此后新增即红)
        run: python -m ruff check opensearch_pipeline/ tests/
      - name: Test (simulate mode — no external services)
        # perf F#48：xdist 并行（ubuntu runner 4 vCPU）；--dist loadgroup + conftest 分组钩子
        # 复刻 loadfile 语义并把共享本地栈的模块钉到同一 worker（CI 无本地 DB，该组多为 skip）。
        run: python -m pytest tests/ -q -p no:cacheprovider -n auto --dist loadgroup

  # DB 集成门：test job 是纯 simulate（无 MySQL），DB 集成模块（test_pipeline/
  # test_classification/test_concurrency/test_image_funnel 的 requires_local_db 族）在
  # 那里整体 self-skip —— routes/、qa_facts、feedback_handler 里成百条 SQL 从未在合并前
  # 过语法/建表/collation 检查（contribution.py 的跨库 collation JOIN 1267 就是漏到
  # staging 活测才炸的）。本 job 起 MySQL 8.0 service（对齐 RDS/docker-compose 版本），
  # 用 scripts/ci_load_schema.sh 按 schema/README.md 矩阵从零建双库（这一步本身就是
  # "权威 DDL 可从零建库"的门），再只跑 DB 标记的 4 个模块。与 test job 并行，不拖慢它。
  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: your_password   # 对齐 docker-compose.yml / tests/local_stack.py 的 dev 凭证
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 与 test job / 本地 make test 同款全局 simulate（LLM/OSS/HA3 均 mock）；
      # requires_local_db 族在 simulate 下本就对本地栈做真实 DML（见 tests/local_stack.py 文档）。
      RAG_SIMULATE: "true"
      RAG_SIMULATE_API: "true"
      RAG_SIMULATE_DB: "true"
      RAG_SIMULATE_OSS: "true"
      RAG_SIMULATE_OPENSEARCH: "true"
      # 指向 service container —— conftest 的 prod-guard 只放行本机目标，127.0.0.1 合规；
      # local_stack 探测用 config 内凭证首连即中，无需回退。
      RAG_RDS_HOST: 127.0.0.1
      RAG_RDS_PORT: "3306"
      RAG_RDS_USER: root
      RAG_RDS_PASSWORD: your_password
      RAG_RDS_DATABASE: fuling_knowledge
      RAG_RDS_OPERATION_DATABASE: fuling_operation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,production,ocr,api]"
      - name: Load authoritative schema (both DBs, numeric order)
        run: bash scripts/ci_load_schema.sh
      # 防"绿得发虚"：requires_local_db 族在探测失败时整体 skip（test job 里正是如此），
      # 若本 job 探测哪天悄悄断线（如驱动/认证依赖变化），pytest 仍会全 skip 变绿。
      # 这里显式要求探测必须接线成功，否则直接红。
      - name: Preflight — DB probe must wire (no silent all-skip)
        run: |
          python -c "
          from tests.local_stack import ensure_local_db_wired, local_db_unavailable_reason
          assert ensure_local_db_wired(), local_db_unavailable_reason()
          print('DB probe wired OK')
          "
      - name: DB integration tests (real MySQL, real DML)
        # 4 个模块在 conftest 的 xdist 分组里本就同组串行（互相清表），xdist 无收益 → 直接串行跑
        run: >-
          python -m pytest tests/test_pipeline.py tests/test_classification.py
          tests/test_concurrency.py tests/test_image_funnel.py
          -q --tb=short -p no:cacheprovider

  # 供应链/密钥门（P2-03）：secret 扫描 + 依赖 CVE 审计。此前 CI 完全无安全门。
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史：gitleaks 既扫工作树也扫历史提交
      # 【阻塞】secret 扫描：默认规则 + .gitleaks.toml 白名单（测试合成假 key + 生产指纹非密钥）。
      # 价值主要在【防未来误提交】真凭证——当前 .mcp.json/.env.* 均 gitignored，工作树本就干净。
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # 依赖 CVE 审计【阻塞】：2026-07-04 基线 triage=0 已知 CVE（run 28692900106，77 包全新
      # 解析到最新版）。CI 每次 fresh resolve，新上游 CVE 会即时红——这正是本门的目的。
      # 若某个传递依赖的 CVE 不可修且不影响本仓库用法：加 `--ignore-vuln <ID>`（附一行理由），
      # 勿回退 continue-on-error（会重新静默积债）。
      - name: Dependency CVE audit (pip-audit — BLOCKING; baseline clean 2026-07-04)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[production,api,ocr]"
          python -m pip_audit --desc

  # 前端门（console-app Vite/Vue3）：此前完全无 CI——135 个 vitest 与 vue-tsc 类型检查从未在
  # 合并前跑过。本 job 把它们设为【阻塞】门：build 含 vue-tsc 类型检查（package.json:8），故无需
  # 单独 typecheck 步。node 22 对齐本地工具链；构建产物（next-dist/）gitignore，仅作编译校验。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-app/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Test (vitest)
        run: npm run test
      - name: Build (vue-tsc 类型检查 + vite build)
        run: npm run build
