name: Frontend

# 从 ci.yml 拆出的前端门 + 新增小程序单测门。paths 过滤：纯后端推送不再白跑
# npm ci + vitest + build（~30s/次）。workflow_dispatch 供手动验证工作流本身。
# 注意：console/miniapp 任一目录变更会同时跑两个 job——都很便宜，不值得再细分。

on:
  push:
    # ⚠️ 2026-08-01：去掉 `branches: [main, "claude/**"]` 过滤，改为**全部分支**。
    # 理由同 ci.yml：实测 fix/+feat/ 合计 23 个分支比 claude/ 的 21 个还多，多数工作
    # 分支从来没跑过前端门；本次 feat/node-acl-phase-a 全程未触发，一个 vue-tsc TS2322
    # 就这么上了线（「保存可见范围」按钮永久禁用）。paths 过滤仍在 ⇒ 纯后端推送不白跑。
    paths:
      - "console-app/**"
      - "fuling-rag-miniapp/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "console-app/**"
      - "fuling-rag-miniapp/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # console-app（Vite/Vue3）：135 个 vitest + vue-tsc 类型检查（build 内含，package.json:8）。
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-app/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Test (vitest)
        run: npm run test
      # 独立一步跑 typecheck。⚠️ **它不是这次事故的修复**——事故的唯一原因是分支 filter
      # 让本分支从没跑过 CI（见上方 on: 注释）。2026-08-01 净室实测（git worktree 检出
      # 修复前的 813bda3 复跑）已**推翻**"增量缓存会掩盖类型错误"这个猜测：
      #     无 .tsbuildinfo      vue-tsc -b   exit=2 报错 ✅
      #     有 .tsbuildinfo(增量) vue-tsc -b   exit=2 报错 ✅
      #     npm run build        exit=2 报错 ✅ 且不产出产物
      # 也就是说 build 那步本来就拦得住。加这一步只为两点边际收益：
      #   ① 失败信息直指类型问题，不混 vite/压缩噪声；
      #   ② 与 console-app/CLAUDE.md 的 done bar（npm run typecheck）字面一致。
      # ⚠️ 顺带记一条真正的坑：当时报"vue-tsc exit=0"最可能是 `| tail` 吞掉了退出码
      #    （见 ~/.claude 记忆 feedback-verify-exit-codes）。验证要显式回显 ${PIPESTATUS}。
      - name: Typecheck (vue-tsc --noEmit)
        run: npm run typecheck
      - name: Build (vite build + 压缩产物)
        run: npm run build

  # δ4a（M14，Majors 批次 δ，codex 共识 2026-07-21）：Playwright UX 硬门进 CI——
  # 三视口 projects 全跑（playwright.config.ts 硬门口径：1440/1280/1024）；trace 用
  # CLI 传 retain-on-failure（不动 config retries:0 的本地不容 flake 纪律）；失败双上传
  # playwright-report/ + test-results/（HTML 报告 + trace/video/error-context 离线归因）。
  # dev server 由 playwright.config webServer 自起（:5177 严格端口，绝不复用外部 server）。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-app/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright 三视口硬门)
        run: npm run e2e -- --trace=retain-on-failure
      - name: Upload playwright-report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: console-app/playwright-report/
          retention-days: 14
      - name: Upload test-results (trace/video/error-context)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-test-results
          path: console-app/test-results/
          retention-days: 14

  # 小程序纯函数单测（markdown/typewriter）：node 内置 runner，零依赖零安装，
  # 与本地 `make miniapp-test` 完全同款——此前完全不在 CI。
  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Test (node --test, 同 make miniapp-test)
        run: node --test fuling-rag-miniapp/tests/units.test.mjs
