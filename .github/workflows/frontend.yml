name: Frontend

# 从 ci.yml 拆出的前端门 + 新增小程序单测门。paths 过滤：纯后端推送不再白跑
# npm ci + vitest + build（~30s/次）。workflow_dispatch 供手动验证工作流本身。
# 注意：console/miniapp 任一目录变更会同时跑两个 job——都很便宜，不值得再细分。

on:
  push:
    # ⚠️ 2026-08-01：去掉 `branches: [main, "claude/**"]` 过滤，改为**全部分支**。
    # 理由同 ci.yml：实测 fix/+feat/ 合计 23 个分支比 claude/ 的 21 个还多，多数工作
    # 分支从来没跑过前端门；本次 feat/node-acl-phase-a 全程未触发，一个 vue-tsc TS2322
    # 就这么上了线（「保存可见范围」按钮永久禁用）。paths 过滤仍在 ⇒ 纯后端推送不白跑。
    paths:
      - "console-app/**"
      - "fuling-rag-miniapp/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "console-app/**"
      - "fuling-rag-miniapp/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # console-app（Vite/Vue3）：135 个 vitest + vue-tsc 类型检查（build 内含，package.json:8）。
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-app/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Test (vitest)
        run: npm run test
      # ⚠️ 独立一步跑 typecheck，**不要**只依赖下面 build 里的 `vue-tsc -b`：
      #   ① `-b` 是 build 模式、带 .tsbuildinfo 增量缓存，本地极易出现"没真跑却 exit 0"；
      #   ② 失败时这一步的报错直指类型问题，而 build 失败会混进 vite/压缩的噪声；
      #   ③ console-app/CLAUDE.md 的 done bar 本就写着 `npm run typecheck`，CI 该与之一致。
      # 2026-08-01：TS2322（「保存可见范围」按钮永久禁用）就是在只有 build 的情况下漏掉的。
      - name: Typecheck (vue-tsc --noEmit)
        run: npm run typecheck
      - name: Build (vite build + 压缩产物)
        run: npm run build

  # δ4a（M14，Majors 批次 δ，codex 共识 2026-07-21）：Playwright UX 硬门进 CI——
  # 三视口 projects 全跑（playwright.config.ts 硬门口径：1440/1280/1024）；trace 用
  # CLI 传 retain-on-failure（不动 config retries:0 的本地不容 flake 纪律）；失败双上传
  # playwright-report/ + test-results/（HTML 报告 + trace/video/error-context 离线归因）。
  # dev server 由 playwright.config webServer 自起（:5177 严格端口，绝不复用外部 server）。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-app/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright 三视口硬门)
        run: npm run e2e -- --trace=retain-on-failure
      - name: Upload playwright-report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: console-app/playwright-report/
          retention-days: 14
      - name: Upload test-results (trace/video/error-context)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-test-results
          path: console-app/test-results/
          retention-days: 14

  # 小程序纯函数单测（markdown/typewriter）：node 内置 runner，零依赖零安装，
  # 与本地 `make miniapp-test` 完全同款——此前完全不在 CI。
  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Test (node --test, 同 make miniapp-test)
        run: node --test fuling-rag-miniapp/tests/units.test.mjs
