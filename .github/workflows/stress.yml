# agent 压测：零成本 mock 档全矩阵，MySQL 走 service container + ci_load_schema。
# 四通道（RB-05 + Majors δ1/M11）：
#   1) pull_request（paths 限 agent runtime/压测面）→ smoke 档，**进 required checks 硬门**
#      ——硬门只含功能正确性断言（gates.py hard_fail 判据），G1-G9 容量门保持 draft 非阻断；
#   2) push（本分支，无 paths 限定）→ smoke 档非阻断——日常提交多为直接 push 而非 PR，
#      此前压测面在 push 流上零覆盖（M11）；
#   3) schedule 每周日 → full 档（含 30min 浸泡）非阻断，失败靠通知；
#   4) workflow_dispatch → 手工任意档。
# staging 真实计费档不进 CI（上线手册裁决，docs/agent_stress_test_launch_plan_2026-07-12.md）。
name: stress

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "smoke | full（full 含 30min 浸泡）"
        default: "smoke"
        required: false
  pull_request:
    paths:
      - "stress_harness/**"
      - "opensearch_pipeline/agent_runtime/**"
      - "opensearch_pipeline/agent_tools/**"
      - "opensearch_pipeline/routes/agent*"
  push:
    # δ1（M11，Majors 批次 δ，codex 共识 2026-07-21）：**无 paths 限定**——压测护的是
    # 整机行为（config/db/serving 共享件改动同样能撕开 agent 面），smoke 档分钟级、
    # runner 额度内；时长超预算再收窄 paths 并在此记录取舍。
    branches: [claude/ontology-p0]
  schedule:
    # ⚠️ schedule 在本仓是死项：GitHub 只对**默认分支（main）**评估 cron，而本工作流
    # 只存在于 claude/ontology-p0（agent 域仅落分支的拍板）——保留此节仅为「分支若成为
    # 默认/被合并时自动复活」，当前实际无人值守通道 = 上方 push 触发（δ1/M11 如实注记）。
    - cron: "0 20 * * 0"   # 周日 20:00 UTC（周一 04:00 北京）full 档周检

concurrency:
  group: stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-local:
    runs-on: ubuntu-latest
    # full（schedule）含 30min 浸泡；PR/dispatch smoke 档 45min 内绰绰有余
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 45 }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: your_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pyour_password"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[api,dev,production]"
      - name: Load schema (both DBs, numeric order)
        run: bash scripts/ci_load_schema.sh
      - name: Harness unit smoke
        run: python -m pytest tests/test_stress_harness_smoke.py -q
      - name: Stress matrix
        # PR=smoke（硬门）；schedule=full（周检）；dispatch=按输入
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then SCALE=full; \
          else SCALE="${{ github.event.inputs.scale || 'smoke' }}"; fi
          python -m stress_harness.runner --scenario matrix --tier local --scale "$SCALE"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: stress-report
          path: stress_harness/reports/
          retention-days: 30
