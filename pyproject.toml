[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensearch-rag-pipeline"
version = "0.1.0"
description = "Enterprise knowledge base pipeline: document extraction → chunking → OpenSearch indexing"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pypdf>=4.0",
    "pdfplumber>=0.11",     # PDF 版面/文本提取（pdf_extractor 主路径）
    "python-docx>=1.0",
    "python-pptx>=0.6",     # PPTX 提取（_extract_pptx）— 漏声明致 DataWorks pptx 静默空抽
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
ocr = [
    "PyMuPDF>=1.24",       # fitz: PDF → image for OCR
]
production = [
    "pymysql[rsa]>=1.1",    # [rsa]=cryptography：MySQL 8 默认 caching_sha2_password 非 TLS 连接需 RSA 密钥交换；
                            #   此前仅靠传递依赖存在（CI db-integration 与本地 dev 栈都依赖它），显式声明消除隐式依赖
    "DBUtils>=3.0",
    "opensearch-py>=2.4",
    "oss2>=2.18",
    "dashscope>=1.14",
    "alibabacloud-ha3engine-vector>=1.1.18",
    "dingtalk-stream>=0.24",
    "jieba>=0.42",          # 中文分词：image_relation_classifier（chunker DAG2 图文关系分类）顶层依赖；
                            #   chunker 以 try/except 容灾降级，但生产链路启用该特性需安装，故归 production
    "Pillow>=10.0",         # PIL：image_funnel_processor.py 顶层 `from PIL import Image`（生产 VLM 图片漏斗，
                            #   DAG1 抽取）；此前仅靠传递依赖存在，显式声明消除隐式依赖
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",    # perf F#48：make test / CI 以 -n auto --dist loadgroup 并行（分组钩子见 tests/conftest.py）
    "ruff>=0.4",
    "httpx>=0.27",
    "numpy>=1.24",          # 仅 DAG4 模拟检索(eval，未接入生产) + tests/eval + test_live_similarity 用
    "rank-bm25>=0.2",       # 仅 DAG4 模拟检索(node_simulate_retrieval, eval，未接入生产) + tests/eval 用
    "python-dotenv>=1.0",   # config._load_env_files 以 try/except 可选加载 .env（生产由 SAE/DataWorks 注入环境变量，
                            #   不需此包）；测试(test_gemini_classification/test_dashscope_emb)直接 import，故归 dev
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
rag-pipeline = "opensearch_pipeline.run_simulation:main"
rag-api = "opensearch_pipeline.api:main"

[tool.setuptools.packages.find]
include = ["opensearch_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
# B6（P2-16）：odps 是 DataWorks PyODPS 节点的运行时注入全局（非 import 可得），
# 按 builtins 声明——评审点名的 per-file F821 之 ruff 原生解法。
builtins = ["odps"]
# 本地代理/工具产物目录（未跟踪、非交付面）：.agents 是 agent skill 的脚本快照、
# .claude/.codex 是会话工作区（含嵌套 worktree）——扫进来会让 make lint 因仓外噪声
# 假红（2026-07-22 实测 .agents 69 错全非交付代码）。CI 检出树不含它们，此排除只
# 影响本地 done-bar 口径。
extend-exclude = [".agents", ".claude", ".codex"]

[tool.ruff.lint]
# E701/E702（单行冒号/分号复合语句）：仓库既有紧凑风格（`if conn: conn.rollback()` 等
# ~89 处），封禁只产生无信息量的大面积 churn——按项目约定豁免。其余规则全量生效，
# CI test job 的 lint 步为【阻塞】门（2026-07-04 存量债清零后翻正）。
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# tests/eval/ 是带 sys.path bootstrap 的独立评测脚本（不进 pytest 收集）：
# bootstrap 后才能 import 包（E402 刻意）；脚本间复制演化保留了备用 import/变量，
# 逐个清理无收益。包代码与正式测试不在豁免之列。
"tests/eval/*" = ["E402", "F401", "F841", "E731"]
# B6（P2-16 全仓纳管）：DataWorks 粘贴脚本按「凭证/依赖/下载/解压」分段布局，
# import 天然穿插各段（E402 结构性豁免）；下列 scripts 为 env-bootstrap 一次性
# 脚本（先设 os.environ 再 import 包，同 tests/eval 既例）。新脚本默认不豁免。
"dataworks_nodes/*.py" = ["E402"]
"scripts/dataworks_stage3_with_cleanup.py" = ["E402"]
"scripts/validate_v2.py" = ["E402"]
"scripts/eval_image_binding_accuracy.py" = ["E402"]
"scripts/online_eval.py" = ["E402"]
"scripts/export_full_to_oss_for_v2.py" = ["E402"]
"scripts/diagnose_image_chunks.py" = ["E402"]
